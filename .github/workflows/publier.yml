name: Publier l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      # Adresse du site, pour les liens d'invitation envoyés depuis l'APK et sa mise à jour.
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      VITE_BUILD: ${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # L'APK Android (alertes de résiliation). S'il ne se fabrique pas, le site est quand même publié.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Fabriquer l'APK
        id: apk
        continue-on-error: true
        env:
          # Clé de signature, toujours la même pour installer les mises à jour par-dessus. Rangée dans les secrets du dépôt.
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "Il manque le secret ANDROID_KEYSTORE : l'APK n'est pas fabriqué." | tee apk-build.log
            exit 1
          fi
          printf "%s" "$ANDROID_KEYSTORE" | tr -d " \r\n" | base64 -d > android/app/pasdtal.keystore
          printf 'storeFile=pasdtal.keystore\nstorePassword=pasdtal\nkeyAlias=pasdtal\nkeyPassword=pasdtal\n' > android/app/signing.properties
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../apk-build.log
      - name: Joindre l'APK au site
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ "${{ steps.apk.outcome }}" = success ] && [ -f "$APK" ]; then
            cp "$APK" dist/pasdtal.apk
            echo "{\"build\": $BUILD_NUMBER, \"apk\": true}" > dist/version.json
          else
            echo "{\"build\": $BUILD_NUMBER, \"apk\": false}" > dist/version.json
            tail -n 200 apk-build.log > dist/apk-build.txt || true
          fi
          ls -la dist | head -20

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
